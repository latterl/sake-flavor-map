name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/sake_map.html'
      - 'docs/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp app/sake_map.html _site/index.html
          cp -r docs _site/docs
          cp LICENSE THIRD_PARTY_NOTICES.txt _site/
          # Jekyll の処理を無効化（アンダースコア始まりのファイル対策）
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
